    <script>
      document.documentElement.classList.add("splash-fonts-loading");
      window.splashFontFallback = setTimeout(() => {
        document.documentElement.classList.remove("splash-fonts-loading");
      }, 5000);
      window.pageFontsReady = new Promise((resolve) => {
        document.addEventListener("DOMContentLoaded", () => {
          Promise.race([
            document.fonts.ready,
            new Promise((done) => setTimeout(done, 4000)),
          ]).then(resolve);
        }, { once: true });
      });
    </script>

        <div class="contactRight">

            <label class="VisuallyHidden" for="contact-name">Name</label>
            <input id="contact-name" class="FormField" name="name" type="text" placeholder="Name" autocomplete="name" required />
            <label class="VisuallyHidden" for="contact-email">Email</label>
            <input id="contact-email" class="FormField" name="email" type="email" placeholder="Email" autocomplete="email" required />
            <label class="VisuallyHidden" for="contact-message">Message</label>
            <textarea id="contact-message" class="FormField" name="message" placeholder="Message" required></textarea>
            <button class="SendButton" type="submit">Submit</button>
