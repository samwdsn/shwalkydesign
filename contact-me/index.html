    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <!-- Preload only the fonts needed at the top of this page. -->
    <link rel="preload" href="/fonts/MangoGrotesque-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InterDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InterDisplay-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Hide splash content before first paint; never leave it hidden indefinitely. -->
    <script>
      document.documentElement.classList.add("splash-fonts-loading");
      window.splashFontFallback = setTimeout(() => {
        document.documentElement.classList.remove("splash-fonts-loading");
      }, 5000);
    </script>
    <link rel="stylesheet" href="/main.css" />
    <!-- Version-pinned CDN animation libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"
      defer
    ></script>

    <script src="/main.js" defer></script>
  </head>
  <body>
    <button
      class="BurgerButton"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="BurgerMenu"
    >
      <span class="BurgerLine"></span>
      <span class="BurgerLine"></span>
    </button>

    <dialog
      class="BurgerMenu"
      id="BurgerMenu"
      aria-label="Site menu"
      data-lenis-prevent
    >
      <nav class="BurgerNav" aria-label="Site navigation">
        <a class="BurgerLink" href="/">Home</a>
        <a class="BurgerLink" href="/portfolio-work/">Portfolio Work</a>
        <a class="BurgerLink" href="/contact-me/">Contact Me</a>
      </nav>
      <div class="SocialWrapper BurgerSocials">
        <a
          class="SocialButton"
          href="https://instagram.com/samwalkerdesign"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <svg class="SocialLogos" viewBox="0 0 85 85" aria-hidden="true">
            <use href="/SVG/InstagramLogo.svg#Layer_2"></use>
          </svg>
        </a>
        <a
          class="SocialButton"
          href="https://www.linkedin.com/in/samwalkerdesign/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
        >
          <svg class="SocialLogos" viewBox="0 0 80 80" aria-hidden="true">
            <use href="/SVG/LinkedInLogo.svg#Layer_2"></use>
          </svg>
        </a>
        <a
          class="SocialButton"
          href="mailto:samwdsn@gmail.com"
          aria-label="Email"
        >
          <svg class="SocialLogos" viewBox="0 0 80 65" aria-hidden="true">
            <use href="/SVG/Email.svg#Layer_2"></use>
          </svg>
        </a>
        <div class="SocialButton">
          <svg class="SocialLogos" viewBox="0 0 80 80" aria-hidden="true">
            <use href="/SVG/Location.svg#Layer_2"></use>
          </svg>
          <span class="FooterMCR">, UK</span>
        </div>
      </div>
    </dialog>
    <div class="ColorFlowBackground" aria-hidden="true"></div>

    <section class="SplashSection">
      <div class="SplashImageContainer">
        <div class="SplashCarouselTrack">
          <div class="SplashCarouselSlide">
            <img
              class="SplashImg Greyscale"
              src="/images/Splash/Splash_01.jpg"
              alt="Portfolio project image 1"
              fetchpriority="high"
              decoding="async"
            />
          </div>
          <div class="SplashCarouselSlide">
            <img
              class="SplashImg Greyscale"
              src="/images/Splash/Splash_02.jpg"
              alt="Portfolio project image 2"
              loading="lazy"
              decoding="async"
            />
          </div>
          <div class="SplashCarouselSlide">
            <img
              class="SplashImg Greyscale"
              src="/images/Splash/Splash_03.jpg"
              alt="Portfolio project image 3"
              loading="lazy"
              decoding="async"
            />
          </div>
          <div class="SplashCarouselSlide">
            <img
              class="SplashImg Greyscale"
              src="/images/Splash/Splash_04.jpg"
              alt="Portfolio project image 4"
              loading="lazy"
              decoding="async"
            />
          </div>
          <div class="SplashCarouselSlide">
            <img
              class="SplashImg Greyscale"
              src="/images/Splash/Splash_05.jpg"
              alt="Portfolio project image 5"
              loading="lazy"
              decoding="async"
            />
          </div>
          <div class="SplashCarouselSlide">
            <img
              class="SplashImg Greyscale"
              src="/images/Splash/Splash_06.jpg"
              alt="Portfolio project image 6"
              loading="lazy"
              decoding="async"
            />
          </div>
          <div class="SplashCarouselSlide">
            <img
              class="SplashImg Greyscale"
              src="/images/Splash/Splash_07.jpg"
              alt="Portfolio project image 7"
              loading="lazy"
              decoding="async"
            />
          </div>
        </div>
        <div class="SplashCarouselDots" aria-label="Splash image navigation"></div>
      </div>
      <div class="SplashContentContainer">
        <h1>Drop me a <span class="Highlight">Message! </span></h1>
        <p class="ContactSplashCopy">
          <span class="ContactSplashFirstSentence">Have a project in mind or need some extra creative support?</span>
          <br class="ContactSplashBreak" />
          Get in touch and <strong>let’s make it happen.</strong>
        </p>

        <div class="Contact_SplashForm">
          <form
            target="_blank"
            action="https://formsubmit.co/samwdsn@gmail.com"
            method="POST"
          >
            <label class="VisuallyHidden" for="contact-name">Name</label>
            <input
              id="contact-name"
              name="name"
              type="text"
              class="FormField"
              placeholder="Name"
              autocomplete="name"
              required
            />
            <label class="VisuallyHidden" for="contact-email">Email</label>
            <input
              id="contact-email"
              name="email"
              type="email"
              class="FormField"
              placeholder="Email"
              autocomplete="email"
              required
            />
            <label class="VisuallyHidden" for="contact-message">Message</label>
            <textarea
              id="contact-message"
              name="message"
              class="FormField"
              placeholder="Message"
              required
            ></textarea>
            <button class="SendButton" type="submit">Submit</button>
          </form>
        </div>
      </div>
    </section>

    <section id="contactfooter-section" class="FooterSection">
      <div class="ContactFooterMain">
        <div class="FooterGiT">
          <h2>
            Creative design<br class="ContactFooterMobileBreak" />
            for<br class="ContactFooterBreak" />
            <em>ambitious</em><br class="ContactFooterMobileBreak" />
            global brands.
          </h2>
        </div>
        <div class="SocialWrapper">
          <a
            class="SocialButton"
            href="https://instagram.com/samwalkerdesign"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <svg class="SocialLogos" viewBox="0 0 85 85">
              <use href="/SVG/InstagramLogo.svg#Layer_2"></use>
            </svg>
          </a>

          <a
            class="SocialButton"
            href="https://www.linkedin.com/in/samwalkerdesign/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <svg class="SocialLogos" viewBox="0 0 80 80">
              <use href="/SVG/LinkedInLogo.svg#Layer_2"></use>
            </svg>
          </a>

          <a
            class="SocialButton"
            href="mailto:samwdsn@gmail.com"
            aria-label="Email"
          >
            <svg class="SocialLogos" viewBox="0 0 80 65">
              <use href="/SVG/Email.svg#Layer_2"></use>
            </svg>
          </a>

          <div class="SocialButton">
            <svg class="SocialLogos" viewBox="0 0 80 80">
              <use href="/SVG/Location.svg#Layer_2"></use>
            </svg>

            <span class="FooterMCR">, UK</span>
          </div>
        </div>
      </div>

      <p class="FooterTXT">© Sam Walker | All Rights Reserved | 2026</p>
    </section>
  </body>
</html>
